name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (for example 1.0.0)"
        required: true
        type: string
      draft:
        description: "Create the release as a draft"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Validate version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:REQUESTED_VERSION.Trim()

          if ($version.StartsWith("v", [System.StringComparison]::OrdinalIgnoreCase)) {
            $version = $version.Substring(1)
          }

          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$') {
            throw "Invalid version '$version'. Expected a value such as 1.0.0 or 1.0.0-beta.1."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $version"

      - name: Test
        shell: pwsh
        run: dotnet test wsl-squad.slnx -c Release

      - name: Publish application
        shell: pwsh
        run: |
          ./scripts/publish-framework-dependent.ps1
          ./scripts/publish-self-contained.ps1

      - name: Prepare signing
        id: signing
        shell: pwsh
        env:
          SIGNING_CERTIFICATE: ${{ secrets.SIGNING_CERTIFICATE }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE)) {
            "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Host "No signing certificate configured; artifacts will be unsigned."
            exit 0
          }

          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PASSWORD)) {
            throw "SIGNING_PASSWORD is required when SIGNING_CERTIFICATE is set."
          }

          $pfx = Join-Path $env:RUNNER_TEMP "wsl-squad-signing.pfx"
          [IO.File]::WriteAllBytes(
            $pfx,
            [Convert]::FromBase64String($env:SIGNING_CERTIFICATE))

          $command = Get-Command signtool.exe -ErrorAction SilentlyContinue
          $signtool = if ($command) { $command.Source } else { $null }

          if (-not $signtool) {
            $roots = @(
              "${env:ProgramFiles(x86)}\Windows Kits\10\bin",
              "${env:ProgramFiles}\Windows Kits\10\bin"
            ) | Where-Object { $_ -and (Test-Path $_) }

            if ($roots) {
              $signtool = Get-ChildItem -Path $roots -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
                Sort-Object FullName -Descending |
                Select-Object -First 1 -ExpandProperty FullName
            }
          }

          if (-not $signtool) {
            throw "signtool.exe was not found."
          }

          "enabled=true" >> $env:GITHUB_OUTPUT
          "pfx=$pfx" >> $env:GITHUB_OUTPUT
          "signtool=$signtool" >> $env:GITHUB_OUTPUT

      - name: Sign application binaries
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          PFX_PATH: ${{ steps.signing.outputs.pfx }}
          SIGNTOOL_PATH: ${{ steps.signing.outputs.signtool }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          $arguments = @(
            "sign",
            "/fd", "SHA256",
            "/tr", "http://timestamp.digicert.com",
            "/td", "SHA256",
            "/f", $env:PFX_PATH
          )

          if (-not [string]::IsNullOrEmpty($env:SIGNING_PASSWORD)) {
            $arguments += @("/p", $env:SIGNING_PASSWORD)
          }

          $arguments += @(
            "artifacts\publish\framework-dependent\gui\wsl-squad.gui.exe",
            "artifacts\publish\framework-dependent\cli\wsl-squad.cli.exe",
            "artifacts\publish\self-contained\gui\wsl-squad.gui.exe",
            "artifacts\publish\self-contained\cli\wsl-squad.cli.exe"
          )

          & $env:SIGNTOOL_PATH @arguments

          if ($LASTEXITCODE -ne 0) {
            throw "Signing the application binaries failed with exit code $LASTEXITCODE."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installers
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe not found at $iscc."
          }

          & $iscc "installer\wsl-squad.iss" "/DAppVersion=$env:APP_VERSION" "/DSelfContained=0"

          if ($LASTEXITCODE -ne 0) {
            throw "Framework-dependent installer compilation failed with exit code $LASTEXITCODE."
          }

          & $iscc "installer\wsl-squad.iss" "/DAppVersion=$env:APP_VERSION" "/DSelfContained=1"

          if ($LASTEXITCODE -ne 0) {
            throw "Self-contained installer compilation failed with exit code $LASTEXITCODE."
          }

      - name: Sign installers
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          PFX_PATH: ${{ steps.signing.outputs.pfx }}
          SIGNTOOL_PATH: ${{ steps.signing.outputs.signtool }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          $arguments = @(
            "sign",
            "/fd", "SHA256",
            "/tr", "http://timestamp.digicert.com",
            "/td", "SHA256",
            "/f", $env:PFX_PATH
          )

          if (-not [string]::IsNullOrEmpty($env:SIGNING_PASSWORD)) {
            $arguments += @("/p", $env:SIGNING_PASSWORD)
          }

          $arguments += @(
            "artifacts\dist\wsl-squad-setup.exe",
            "artifacts\dist\wsl-squad-setup-self-contained.exe"
          )

          & $env:SIGNTOOL_PATH @arguments

          if ($LASTEXITCODE -ne 0) {
            throw "Signing the installers failed with exit code $LASTEXITCODE."
          }

      - name: Create portable ZIPs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/dist | Out-Null
          Compress-Archive -Path artifacts/publish/framework-dependent/* `
            -DestinationPath artifacts/dist/wsl-squad-portable.zip -Force
          Compress-Archive -Path artifacts/publish/self-contained/* `
            -DestinationPath artifacts/dist/wsl-squad-portable-self-contained.zip -Force

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem -Path artifacts/dist/*.exe, artifacts/dist/*.zip |
            ForEach-Object {
              $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } |
            Set-Content artifacts/dist/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "wsl-squad-${{ steps.version.outputs.version }}"
          path: artifacts/dist/*
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "WSL Squad ${{ steps.version.outputs.version }}"
          target_commitish: ${{ github.sha }}
          draft: ${{ inputs.draft }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/dist/wsl-squad-setup.exe
            artifacts/dist/wsl-squad-setup-self-contained.exe
            artifacts/dist/wsl-squad-portable.zip
            artifacts/dist/wsl-squad-portable-self-contained.zip
            artifacts/dist/SHA256SUMS.txt
