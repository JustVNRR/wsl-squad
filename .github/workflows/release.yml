name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (for example 1.0.0)"
        required: true
        type: string
      draft:
        description: "Create the release as a draft"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Validate version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:REQUESTED_VERSION.Trim()

          if ($version.StartsWith("v", [System.StringComparison]::OrdinalIgnoreCase)) {
            $version = $version.Substring(1)
          }

          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$') {
            throw "Invalid version '$version'. Expected a value such as 1.0.0 or 1.0.0-beta.1."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $version"

      - name: Test
        shell: pwsh
        run: dotnet test wsl-squad.slnx -c Release

      - name: Publish application
        shell: pwsh
        run: ./scripts/publish-framework-dependent.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe not found at $iscc."
          }

          & $iscc "installer\wsl-squad.iss" "/DAppVersion=$env:APP_VERSION"

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE."
          }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/dist | Out-Null
          Compress-Archive -Path artifacts/publish/framework-dependent/* -DestinationPath artifacts/dist/wsl-squad-portable.zip -Force

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem artifacts/dist/*.exe, artifacts/dist/*.zip |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content artifacts/dist/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "wsl-squad-${{ steps.version.outputs.version }}"
          path: artifacts/dist/*
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "WSL Squad ${{ steps.version.outputs.version }}"
          target_commitish: ${{ github.sha }}
          draft: ${{ inputs.draft }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/dist/wsl-squad-setup.exe
            artifacts/dist/wsl-squad-portable.zip
            artifacts/dist/SHA256SUMS.txt
